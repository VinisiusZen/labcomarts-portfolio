<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Olho Vivo - Maya Prisma Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <canvas id="game" width="1280" height="720" aria-label="Olho Vivo playable demo"></canvas>
      <div class="scanline"></div>
      <div class="boot-card" id="bootCard">
        <div class="mark">OLHO VIVO</div>
        <h1>Maya Prisma Demo</h1>
        <p>Explore o panorama, colete clareza, evite o terceiro açúcar.</p>
        <div class="controls">
          <span>WASD / setas</span>
          <span>1-3 cenários</span>
          <span>touch</span>
          <span>controle PS</span>
        </div>
        <button id="startButton" type="button">despertar</button>
      </div>
      <div class="status-pill" id="padStatus">controle: procurando</div>
    </main>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
