<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>So Mais Um Miado - Video Sprite Test | Portfolio</title>
    <link rel="stylesheet" href="video-sprite-test.css" />
  </head>
  <body>
    <main class="test-shell">
      <canvas id="testCanvas" aria-label="Teste de sprites extraidos de video"></canvas>

      <section class="test-hud">
        <div>
          <span>Gabarito</span>
          <strong>Video Sprite Test</strong>
        </div>
        <div class="test-state">
          Estado <strong id="stateLabel">IDLE</strong>
        </div>
        <a href="../project.html?id=vida-de-gato-wip">Voltar ao portfolio</a>
      </section>

      <aside class="test-panel">
        <label>
          Estado manual
          <select id="manualState">
            <option value="auto">AUTO</option>
            <option value="idle">IDLE</option>
            <option value="walk">WALK</option>
            <option value="run">RUN</option>
            <option value="attack">ATTACK / STARTLED</option>
          </select>
        </label>
        <label>
          Escala
          <input id="scaleSlider" type="range" min="0.45" max="1.5" step="0.05" value="0.72" />
          <span id="scaleValue">0.72</span>
        </label>
        <label>
          FPS
          <input id="fpsSlider" type="range" min="4" max="24" step="1" value="14" />
          <span id="fpsValue">14</span>
        </label>
        <label class="check-row">
          <input id="boundsToggle" type="checkbox" checked />
          Mostrar limites
        </label>
        <label class="check-row">
          <input id="ghostToggle" type="checkbox" />
          Ghost frame
        </label>
        <p>
          A/D ou setas movem. W/S ajustam altura dentro do gabarito. Shift corre. J toca startled.
        </p>
      </aside>
    </main>

    <script src="assets/video_sprite_test/manifest.js"></script>
    <script src="video-sprite-test.js"></script>
  </body>
</html>
